[build]
command = "npx next build"
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

[[scheduled_functions]]
function = "overtime-sweep"
schedule = "*/15 * * * *"

[[scheduled_functions]]
function = "weekly-digest"
schedule = "0 7 * * 1"

[[scheduled_functions]]
function = "monthly-closing"
schedule = "0 7 27 * *"